<!DOCTYPE html>
<html>

<head>

    <title>Admin Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="person-card">

        <h1>Admin Login</h1>

        <form method="POST">

            <input
                type="password"
                name="password"
                class="input-box"
                placeholder="Enter Password"
                required>

            <button
                type="submit"
                class="admin-btn">

                LOGIN

            </button>

        </form>

        {% if error %}

        <p style="color:red;">

            {{ error }}

        </p>

        {% endif %}

    </div>

</body>

</html>
